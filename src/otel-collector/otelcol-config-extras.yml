# Extras/customization layer for the OTel Collector.
# Loaded LAST (compose.yaml: --config=/etc/otelcol-config-extras.yml).
#
# Integration: fan the demo's telemetry out to Bluebox (by Dynatrace) alongside
# the demo's built-in debug/span_metrics exporters. Bluebox reads from the
# Dynatrace environment behind the OTLP endpoint returned by `bluebox otlp-endpoint`.
#
# Secrets/endpoints come from the git-ignored .env.dynatrace file, injected into
# the collector container via compose.yaml (env_file + environment). Nothing
# secret lives in this file.
#
# IMPORTANT: The OTel Collector MERGES config files but REPLACES arrays. The
# pipeline `exporters:` lists below repeat the upstream exporters (debug,
# span_metrics) so they keep working, and add otlphttp/bluebox.

exporters:
  # Bluebox / Dynatrace OTLP-HTTP ingest.
  # - OTLP/HTTP exporter defaults to protobuf (http/protobuf) — required by Dynatrace.
  # - Dynatrace requires DELTA temporality for counter/histogram metrics.
  # - DT_AUTH_HEADER carries the whole Authorization value incl. scheme ("Bearer ...").
  otlphttp/bluebox:
    endpoint: ${env:DT_OTLP_ENDPOINT}
    headers:
      Authorization: "${env:DT_AUTH_HEADER}"

processors:
  # Dynatrace ingests delta metrics; convert cumulative -> delta before export.
  cumulativetodelta/bluebox: {}

service:
  pipelines:
    traces:
      # repeat upstream (debug, span_metrics) + Bluebox
      exporters: [debug, span_metrics, otlphttp/bluebox]
    metrics:
      # add delta conversion for Dynatrace; repeat upstream (debug) + Bluebox
      processors: [resource_detection, memory_limiter, cumulativetodelta/bluebox]
      exporters: [debug, otlphttp/bluebox]
    logs:
      # repeat upstream (debug) + Bluebox
      exporters: [debug, otlphttp/bluebox]
